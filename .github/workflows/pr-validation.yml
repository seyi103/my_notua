name: PR validation

on:
  pull_request:
    branches:
      - codex/implement-ble-file-transfer-to-littlefs-g6s3dk
  push:
    branches:
      - codex/implement-ble-file-transfer-to-littlefs-g6s3dk
      - codex/implement-hardware-validation-spike-for-ble-transfer
  workflow_dispatch:

jobs:
  firmware:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: notua_FW
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install test dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install platformio bleak pillow
      - name: Python tests
        run: python -m unittest discover -s test -v
      - name: Python syntax checks
        run: python -m py_compile scripts/ble_send_test.py scripts/generate_test_images.py
      - name: PlatformIO dev build
        run: python -m platformio run -e esp32-s3-dev
      - name: PlatformIO release build
        run: python -m platformio run -e esp32-s3-release

  flutter-android:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: notua_app
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - name: Resolve Flutter dependencies
        run: flutter pub get
      - name: Flutter analyze
        run: flutter analyze
      - name: Flutter tests
        run: flutter test
      - name: Android debug APK
        run: flutter build apk --debug
