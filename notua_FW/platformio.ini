; PlatformIO Project Configuration File
;
;   Build options: build flags, source filter
;   Upload options: custom upload port, speed and extra flags
;   Library options: dependencies, extra library storages
;   Advanced options: extra scripting
;
; Please visit documentation for the other options and examples
; https://docs.platformio.org/page/projectconf.html

[platformio]
default_envs = esp32-s3-dev

[env]
platform = espressif32
board = esp32-s3-devkitc-1
framework = arduino
lib_deps =
	h2zero/NimBLE-Arduino@2.5.1
; upload_port = COM4

; Fail early if an offline build accidentally grows an IP/OTA dependency or a
; project-local include no longer resolves from src/ or include/.
extra_scripts = pre:scripts/check_offline_dependencies.py

; wroom2 16mb
board_build.arduino.memory_type = qio_opi
board_build.flash_mode = qio
board_build.psram_type = opi
board_upload.flash_size = 16MB
; 단일 오프라인 앱 파티션. WiFi/MQTT/HTTP/OTA 의존성은 사용하지 않는다.
board_upload.maximum_size = 3145728
board_build.partitions = partitions_16mb.csv

board_build.filesystem = littlefs
board_build.extra_flags =
	-DBOARD_HAS_PSRAM
	-DARDUINO_USB_MODE=1
	-DARDUINO_USB_CDC_ON_BOOT=1

; Development is deliberately the default: every terminal path remains awake so
; native USB CDC and the final diagnostic message stay available on the bench.
[env:esp32-s3-dev]
build_flags =
	-DNOTUA_ALLOW_DEEP_SLEEP=0

; Select this environment explicitly for deployed, battery-powered units.
[env:esp32-s3-release]
build_flags =
	-DNOTUA_ALLOW_DEEP_SLEEP=1
